<svg width="800" height="180" viewBox="0 0 800 180"
     xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="sithRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff">
        <animate
          attributeName="stop-color"
          values="#ffffff;#ffb3b3;#ffffff"
          dur="3s"
          repeatCount="indefinite"
        />
      </stop>

      <stop offset="25%" stop-color="#ff5555">
        <animate
          attributeName="stop-color"
          values="#ff5555;#ff0000;#ff5555"
          dur="3s"
          repeatCount="indefinite"
        />
      </stop>

      <stop offset="65%" stop-color="#ff0000">
        <animate
          attributeName="stop-color"
          values="#ff0000;#b30000;#ff0000"
          dur="3s"
          repeatCount="indefinite"
        />
      </stop>

      <stop offset="100%" stop-color="#7a0000">
        <animate
          attributeName="stop-color"
          values="#7a0000;#ff2222;#7a0000"
          dur="3s"
          repeatCount="indefinite"
        />
      </stop>
    </linearGradient>

    <filter id="outerGlow" x="-40%" y="-80%" width="180%" height="260%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>

    <filter id="innerGlow" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <rect width="800" height="180" rx="22" fill="#080a0f"/>

  <!-- Wide red aura -->
  <text
    x="400"
    y="100"
    text-anchor="middle"
    font-family="Arial, Segoe UI, sans-serif"
    font-size="100"
    font-weight="900"
    letter-spacing="2"
    fill="#ff0000"
    opacity="0.75"
    filter="url(#outerGlow)">
    Qaevix
  </text>

  <!-- Strong inner glow -->
  <text
    x="400"
    y="100"
    text-anchor="middle"
    font-family="Arial, Segoe UI, sans-serif"
    font-size="100"
    font-weight="900"
    letter-spacing="2"
    fill="#ff2020"
    filter="url(#innerGlow)">
    Qaevix
  </text>

  <!-- Main readable text -->
  <text
    x="400"
    y="100"
    text-anchor="middle"
    font-family="Arial, Segoe UI, sans-serif"
    font-size="100"
    font-weight="900"
    letter-spacing="2"
    fill="url(#sithRed)"
    stroke="#ff5a5a"
    stroke-width="1">
    Qaevix
    <animate
      attributeName="opacity"
      values="1;0.88;1"
      dur="2s"
      repeatCount="indefinite"
    />
  </text>

</svg>
