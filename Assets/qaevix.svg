<svg width="800" height="180" viewBox="0 0 800 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A61E1E">
        <animate
          attributeName="stop-color"
          values="#A61E1E;#C62828;#FF3B2F;#8E1B1B;#A61E1E"
          dur="8s"
          repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#D32F2F">
        <animate
          attributeName="stop-color"
          values="#D32F2F;#FF4A3D;#B71C1C;#7F1818;#D32F2F"
          dur="8s"
          repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#7F1818">
        <animate
          attributeName="stop-color"
          values="#7F1818;#5A1414;#3B0F0F;#A61E1E;#7F1818"
          dur="8s"
          repeatCount="indefinite"/>
      </stop>
      <animateTransform
        attributeName="gradientTransform"
        type="rotate"
        from="0 0.5 0.5"
        to="360 0.5 0.5"
        dur="8s"
        repeatCount="indefinite"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="5.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="180" rx="22" fill="#0D1117"/>

  <text
    x="50%"
    y="50%"
    text-anchor="middle"
    dominant-baseline="middle"
    font-family="Segoe UI, Arial, sans-serif"
    font-size="78"
    font-weight="700"
    fill="url(#grad)"
    filter="url(#glow)">
    Qaevix
  </text>
</svg>
