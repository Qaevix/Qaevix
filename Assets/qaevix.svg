<svg width="800" height="180" viewBox="0 0 800 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#801D1D">
        <animate
          attributeName="stop-color"
          values="#801D1D;#91211D;#A82A1B;#7B1E19;#471713;#5C1917;#801D1D"
          dur="8s"
          repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#A82A1B">
        <animate
          attributeName="stop-color"
          values="#A82A1B;#8F241B;#6D1A17;#471713;#5C1917;#801D1D;#A82A1B"
          dur="8s"
          repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#471713">
        <animate
          attributeName="stop-color"
          values="#471713;#3A1413;#291312;#3B1413;#5B1917;#7A1E1A;#471713"
          dur="8s"
          repeatCount="indefinite"/>
      </stop>
      <animateTransform
        attributeName="gradientTransform"
        type="rotate"
        from="0 0.5 0.5"
        to="360 0.5 0.5"
        dur="8s"
        repeatCount="indefinite"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="4.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="180" rx="22" fill="#0D1117"/>

  <text
    x="50%"
    y="50%"
    text-anchor="middle"
    dominant-baseline="middle"
    font-family="Segoe UI, Arial, sans-serif"
    font-size="78"
    font-weight="700"
    fill="url(#grad)"
    filter="url(#glow)">
    Qaevix
  </text>
</svg>
